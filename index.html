<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Card Collection Binder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Twitch Card Collection</h1>
    <div class="search-box">
      <input type="text" id="usernameInput" placeholder="Enter Twitch Username...">
      <select id="variantSelect" onchange="filterVariant()">
        <option value="Normal">Normal Cards</option>
        <option value="Rare">Rare Cards</option>
        <option value="Prismatic">Prismatic Cards</option>
      </select>
      <button onclick="loadUserBinder()">Search</button>
    </div>
  </header>

  <!-- Physical Binder Layout -->
  <div class="binder-wrapper">
    <div class="binder-page" id="leftPage"></div>
    <div class="binder-spine"></div>
    <div class="binder-page" id="rightPage"></div>
  </div>

  <div class="pagination">
    <button id="prevBtn" onclick="changePage(-1)">Previous</button>
    <span id="pageIndicator">Page 1 of 1</span>
    <button id="nextBtn" onclick="changePage(1)">Next</button>
  </div>

  <!-- Interactive 3D Zoom Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="card-3d-wrapper">
      <div class="card-3d" id="card3D">
        <img id="modalCardImg" src="" alt="Zoomed Card">
      </div>
    </div>
    <div class="close-hint">Click outside to close • Move cursor to inspect foil reflection</div>
  </div>

  <!-- CSV Parser Dependency -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
