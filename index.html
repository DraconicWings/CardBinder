<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch 3D Card Binder - Live Google Sheets</title>
  <style>
    :root {
      --bg-dark: #0e0e10;
      --card-bg: #18181b;
      --accent: #9146ff;
      --accent-hover: #772ce8;
      --text: #efeff1;
      --text-muted: #adadb8;
      --card-w: 220px;
      --card-h: 310px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1f1f23;
      border-bottom: 1px solid #2d2d35;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-weight: 800;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .input-field, .select-field {
      background: #0e0e10;
      border: 1px solid #3a3a44;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
    }

    main {
      flex: 1;
      padding: 32px 24px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
      gap: 28px;
      justify-items: center;
    }

    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* 3D Card Physics Base */
    .card-container {
      width: var(--card-w);
      height: var(--card-h);
      perspective: 1000px;
      cursor: pointer;
    }

    .card-3d-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      border-radius: 14px;
    }

    /* Strict Backface Hiding */
    .face {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 14px;
      backface-visibility: hidden !important;
      -webkit-backface-visibility: hidden !important;
      overflow: hidden;
      background: #18181b;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .face-front {
      z-index: 2;
      transform: rotateY(0deg);
    }

    .face-back {
      z-index: 1;
      transform: rotateY(180deg);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Foil Finish Layer using Google Sheet Foil_mask */
    .finish-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .card-container:hover .finish-layer,
    .modal-card-stage:hover .finish-layer {
      opacity: 1;
    }

    /* Unowned Grayscale Filter */
    .card-container.unowned .face-front img {
      filter: grayscale(100%) brightness(0.45);
    }

    /* Zoom Modal Stage */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #18181b;
      border: 1px solid #2d2d35;
      border-radius: 18px;
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .modal-close {
      position: absolute;
      top: 14px; right: 14px;
      background: #2d2d35;
      color: #fff;
      border: none;
      width: 34px; height: 34px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-card-stage {
      flex: 1;
      min-width: 320px;
      height: 460px;
      background: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      padding: 20px;
    }

    .modal-card-stage .card-3d-wrapper {
      width: 250px;
      height: 350px;
    }

    .modal-details {
      flex: 1;
      min-width: 260px;
      padding: 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .btn-flip {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-flip:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Twitch Card Binder</div>
    <div class="controls">
      <input type="text" id="userInput" class="input-field" placeholder="Twitch Username..." value="StreamerOne">
      <select id="variantSelect" class="select-field">
        <option value="Normal">Normal Collection</option>
        <option value="Rare">Rare (Masked Foil)</option>
        <option value="Prismatic">Prismatic (Masked Rainbow)</option>
      </select>
    </div>
  </header>

  <main>
    <div class="card-grid" id="cardGrid">
      <div class="loading-state">Loading cards from Google Sheets...</div>
    </div>
  </main>

  <!-- Zoom Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      
      <div class="modal-card-stage" id="modalStage">
        <div class="card-3d-wrapper" id="modalCard">
          <div class="face face-front">
            <img class="card-img" id="modalFrontImg" src="" alt="Front">
            <div class="finish-layer" id="modalFinishLayer"></div>
          </div>
          <div class="face face-back">
            <img class="card-img" id="modalBackImg" src="" alt="Back">
          </div>
        </div>
      </div>

      <div class="modal-details">
        <h2 id="modalTitle">Card Title</h2>
        <div>Variant: <strong id="modalVariant">Normal</strong></div>
        <button class="btn-flip" id="modalFlipBtn">🔄 Flip Card Front/Back</button>
        <div style="background: #26262c; padding: 12px; border-radius: 8px;">
          Quantity Owned: <strong id="modalQuantity">1x</strong>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSw7uMK-pIYU0n_l8ypDgW2GrgLgnQIO5_j6phxej4IetUEDbzizT-xr4X1nV2TPQEYF2fvT2JBdpjJ/pub?gid=0&single=true&output=csv';
    
    let cards = [];
    let isFlipped = false;

    function parseCSV(text) {
      let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return [];
      
      let headers = parseCSVLine(lines[0]).map(h => h.trim());
      let result = [];

      for (let i = 1; i < lines.length; i++) {
        let obj = {};
        let currentLine = parseCSVLine(lines[i]);
        for (let j = 0; j < headers.length; j++) {
          obj[headers[j]] = currentLine[j] ? currentLine[j].trim().replace(/^"|"$/g, '') : '';
        }
        result.push(obj);
      }
      return result;
    }

    function parseCSVLine(text) {
      let result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current);
      return result.map(s => s.replace(/^"|"$/g, ''));
    }

    async function loadSheetData() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();
        const rawData = parseCSV(csvText);

        // Map strictly to your Google Sheet column names
        cards = rawData.map((row, idx) => ({
          id: row.Card_ID || `CARD-${idx + 1}`,
          name: row.Card_Name || `Card ${idx + 1}`,
          rarity: row.Card_Rarity || 'Common',
          artwork: row.Artwork_URL || '',
          maskArtwork: row.Foil_mask || row.Artwork_URL || '',
          backArtwork: row.Back_Artwork_URL || 'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=500'
        }));

        render();
      } catch (err) {
        console.error('Failed to load Google Sheet CSV:', err);
        document.getElementById('cardGrid').innerHTML = `
          <div class="loading-state" style="color: #ff5555;">
            Failed to load card data from Google Sheets. Please check your publishing link or CORS permissions.
          </div>
        `;
      }
    }

    function init() {
      loadSheetData();
    }

    function render() {
      const grid = document.getElementById('cardGrid');
      const selectedVariant = document.getElementById('variantSelect').value;
      grid.innerHTML = '';

      if (cards.length === 0) {
        grid.innerHTML = `<div class="loading-state">No cards found in sheet.</div>`;
        return;
      }

      cards.forEach((card, index) => {
        const isOwned = (index % 2 === 0);
        const cardEl = document.createElement('div');
        cardEl.className = `card-container ${isOwned ? '' : 'unowned'}`;

        const finishConfig = getFinishConfig(selectedVariant, card.maskArtwork);

        cardEl.innerHTML = `
          <div class="card-3d-wrapper">
            <div class="face face-front">
              <img class="card-img" src="${card.artwork}" alt="${card.name}">
              <div class="finish-layer" style="${finishConfig.layerStyle}"></div>
            </div>
            <div class="face face-back">
              <img class="card-img" src="${card.backArtwork}" alt="Back">
            </div>
          </div>
        `;

        const wrapper = cardEl.querySelector('.card-3d-wrapper');
        const finishLayer = cardEl.querySelector('.finish-layer');

        cardEl.addEventListener('mousemove', (e) => {
          const rect = cardEl.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const xc = x - rect.width / 2;
          const yc = y - rect.height / 2;

          const rx = (-yc / rect.height) * 18;
          const ry = (xc / rect.width) * 18;
          wrapper.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;

          if (finishLayer && selectedVariant !== 'Normal') {
            const posX = (x / rect.width) * 100;
            const posY = (y / rect.height) * 100;
            finishLayer.style.backgroundPosition = `${posX}% ${posY}%`;
          }
        });

        cardEl.addEventListener('mouseleave', () => {
          wrapper.style.transform = `rotateX(0deg) rotateY(0deg)`;
          if (finishLayer) finishLayer.style.backgroundPosition = `50% 50%`;
        });

        cardEl.addEventListener('click', () => openModal(card, isOwned, selectedVariant));
        grid.appendChild(cardEl);
      });
    }

    function getFinishConfig(variant, maskUrl) {
      if (variant === 'Rare') {
        return {
          layerStyle: `
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.75) 0%, rgba(255,215,0,0.35) 35%, rgba(0,0,0,0.4) 75%),
                        linear-gradient(110deg, transparent 20%, rgba(255,255,255,0.8) 46%, rgba(255,200,50,0.5) 50%, transparent 75%);
            background-size: 200% 200%, 150% 150%;
            mix-blend-mode: color-dodge;
            -webkit-mask-image: url('${maskUrl}');
            -webkit-mask-size: cover;
            -webkit-mask-position: center;
            mask-image: url('${maskUrl}');
            mask-size: cover;
            mask-position: center;
          `
        };
      } else if (variant === 'Prismatic') {
        return {
          layerStyle: `
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.75) 0%, rgba(0,255,255,0.3) 30%, rgba(255,0,128,0.2) 60%, rgba(0,0,0,0.4) 80%),
                        repeating-linear-gradient(45deg, rgba(255,0,128,0.3) 0%, rgba(0,255,255,0.3) 15%, rgba(255,255,0,0.3) 30%, rgba(255,0,128,0.3) 45%);
            background-size: 220% 220%, 180% 180%;
            mix-blend-mode: color-dodge;
            -webkit-mask-image: url('${maskUrl}');
            -webkit-mask-size: cover;
            -webkit-mask-position: center;
            mask-image: url('${maskUrl}');
            mask-size: cover;
            mask-position: center;
          `
        };
      }
      return { layerStyle: 'display: none;' };
    }

    // Modal Mechanics
    const modalOverlay = document.getElementById('modalOverlay');
    const modalCard = document.getElementById('modalCard');
    const modalStage = document.getElementById('modalStage');

    function openModal(card, isOwned, variant) {
      isFlipped = false;
      document.getElementById('modalTitle').innerText = card.name;
      document.getElementById('modalVariant').innerText = variant;
      document.getElementById('modalQuantity').innerText = isOwned ? '1x Owned' : '0x Unowned';

      document.getElementById('modalFrontImg').src = card.artwork;
      document.getElementById('modalBackImg').src = card.backArtwork;

      const finishConfig = getFinishConfig(variant, card.maskArtwork);
      document.getElementById('modalFinishLayer').style.cssText = finishConfig.layerStyle;

      modalCard.style.transform = 'rotateX(0deg) rotateY(0deg)';
      modalOverlay.classList.add('active');
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    document.getElementById('modalFlipBtn').addEventListener('click', () => {
      isFlipped = !isFlipped;
      modalCard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
    });

    modalStage.addEventListener('mousemove', (e) => {
      const rect = modalStage.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const xc = x - rect.width / 2;
      const yc = y - rect.height / 2;

      const rx = (-yc / rect.height) * 18;
      const ry = (xc / rect.width) * 18;

      const baseAngle = isFlipped ? 180 : 0;
      modalCard.style.transform = `rotateX(${rx}deg) rotateY(${baseAngle + ry}deg)`;

      const currentVariant = document.getElementById('variantSelect').value;
      const modalFinish = document.getElementById('modalFinishLayer');
      if (modalFinish && currentVariant !== 'Normal') {
        const posX = (x / rect.width) * 100;
        const posY = (y / rect.height) * 100;
        modalFinish.style.backgroundPosition = `${posX}% ${posY}%`;
      }
    });

    modalStage.addEventListener('mouseleave', () => {
      modalCard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
    });

    document.getElementById('variantSelect').addEventListener('change', render);

    init();
  </script>
</body>
</html>
