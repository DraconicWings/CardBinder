<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Binder</title>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0e0e10;
      --card-bg: #18181b;
      --accent: #9146ff;
      --accent-hover: #772ce8;
      --text: #efeff1;
      --text-muted: #adadb8;
      --card-w: 220px;
      --card-h: 310px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #1f1f23; border-bottom: 1px solid #2d2d35; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .brand { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 12px; }
    
    /* Centered Controls Layout */
    .controls-center {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px;
    }
    .input-group { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
    .select-field { background: #0e0e10; border: 1px solid #3a3a44; color: var(--text); padding: 8px 12px; border-radius: 6px; outline: none; }

    /* Auth User Section */
    .auth-section { display: flex; align-items: center; gap: 12px; }
    .user-pill { display: flex; align-items: center; gap: 8px; background: #2d2d35; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .btn-twitch { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .btn-twitch:hover { background: var(--accent-hover); }

    main { flex: 1; padding: 32px 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr)); gap: 28px; justify-items: center; }
    .loading-state { grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-muted); font-size: 1.1rem; }

    .card-container { width: var(--card-w); height: var(--card-h); perspective: 1000px; cursor: pointer; }
    .card-3d-wrapper {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
      transition: transform 0.1s ease-out; border-radius: 14px;
    }

    .face {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 14px; backface-visibility: hidden !important; -webkit-backface-visibility: hidden !important;
      overflow: hidden; background: #18181b; box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .face-front { z-index: 2; transform: rotateY(0deg); }
    .face-back { z-index: 1; transform: rotateY(180deg); }
    .card-img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

    @keyframes oscillateSheen {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @keyframes diagonalShine {
      0% { transform: translate(-150%, -150%) rotate(35deg); }
      60% { transform: translate(150%, 150%) rotate(35deg); }
      100% { transform: translate(150%, 150%) rotate(35deg); }
    }

    .finish-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 3; opacity: 1; overflow: hidden;
    }

    .finish-layer::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(
        135deg,
        transparent 35%,
        rgba(255, 255, 255, 0.22) 46%,
        rgba(255, 220, 255, 0.32) 50%,
        rgba(150, 240, 255, 0.22) 54%,
        transparent 65%
      );
      pointer-events: none;
      animation: diagonalShine 8s linear infinite;
      mix-blend-mode: overlay;
    }

    .card-container.unowned .face-front img { filter: grayscale(100%) brightness(0.45); }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000;
      display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #18181b; border: 1px solid #2d2d35; border-radius: 18px;
      width: 100%; max-width: 760px; display: flex; flex-wrap: wrap; position: relative; overflow: hidden;
    }
    .modal-close {
      position: absolute; top: 14px; right: 14px; background: #2d2d35; color: #fff; border: none;
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer; z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-card-stage {
      flex: 1; min-width: 320px; height: 460px; background: #09090b;
      display: flex; align-items: center; justify-content: center; perspective: 1200px; padding: 20px;
    }
    .modal-card-stage .card-3d-wrapper { width: 250px; height: 350px; }
    .modal-details { flex: 1; min-width: 260px; padding: 36px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
    .btn-flip { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-flip:hover { background: var(--accent-hover); }

    /* Admin Sheet Modal */
    .admin-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); z-index: 2000;
      display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .admin-modal.active { display: flex; }
    .admin-box { background: #18181b; border: 1px solid #3a3a44; border-radius: 14px; width: 100%; max-width: 1100px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
    .admin-header { background: #1f1f23; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d35; }
    .admin-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .sheet-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .sheet-table th, .sheet-table td { border: 1px solid #2d2d35; padding: 8px; text-align: left; }
    .sheet-table th { background: #26262c; color: var(--text-muted); }
    .sheet-table input { width: 100%; background: #0e0e10; border: 1px solid transparent; color: #fff; padding: 6px; border-radius: 4px; outline: none; }
    .admin-footer { padding: 16px 20px; background: #1f1f23; border-top: 1px solid #2d2d35; display: flex; justify-content: space-between; align-items: center; }
    .btn { background: #2d2d35; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent); }
    .btn-danger { background: #5a2020; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Card Binder</span>
    </div>

    <div class="controls-center">
      <select id="variantSelect" class="select-field">
        <option value="Normal">Normal</option>
        <option value="Foil">Foil</option>
        <option value="Prismatic">Prismatic</option>
      </select>
    </div>
    
    <div class="auth-section" id="authSection">
      <button class="btn-twitch" id="loginBtn">Log in with Twitch</button>
    </div>
  </header>

  <main>
    <div class="card-grid" id="cardGrid">
      <div class="loading-state">Loading Master Binder from Supabase...</div>
    </div>
  </main>

  <!-- Zoom Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-card-stage" id="modalStage">
        <div class="card-3d-wrapper" id="modalCard">
          <div class="face face-front">
            <img class="card-img" id="modalFrontImg" src="" alt="Front">
            <div class="finish-layer" id="modalFinishLayer"></div>
          </div>
          <div class="face face-back">
            <img class="card-img" id="modalBackImg" src="" alt="Back">
          </div>
        </div>
      </div>
      <div class="modal-details">
        <h2 id="modalTitle">Card Title</h2>
        <div>Variant: <strong id="modalVariant">Normal</strong></div>
        <button class="btn-flip" id="modalFlipBtn">🔄 Flip Card</button>
        <div style="background: #26262c; padding: 12px; border-radius: 8px; text-align: center;" id="modalQuantity">1x owned</div>
      </div>
    </div>
  </div>

  <!-- Secret Spreadsheet Admin Modal -->
  <div class="admin-modal" id="adminModal">
    <div class="admin-box">
      <div class="admin-header">
        <h3>📊 Master Spreadsheet Editor (Supabase Sync)</h3>
        <button class="btn" id="closeAdminBtn">&times; Close</button>
      </div>
      <div class="admin-body">
        <table class="sheet-table" id="sheetTable">
          <thead>
            <tr>
              <th style="width: 90px;">ID</th><th>Name</th><th>Artwork URL</th><th>Back URL</th><th>Foil Matte</th><th>Prismatic Tex</th><th style="width: 40px;">X</th>
            </tr>
          </thead>
          <tbody id="sheetTableBody"></tbody>
        </table>
        <button class="btn" id="addRowBtn" style="margin-top: 8px;">+ Add Row</button>
      </div>
      <div class="admin-footer">
        <button class="btn btn-danger" id="resetDefaultBtn">Reload from DB</button>
        <div style="display: flex; gap: 10px;">
          <button class="btn" id="cancelAdminBtn">Cancel</button>
          <button class="btn btn-primary" id="saveAdminBtn">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Supabase Initialization ---
    const SUPABASE_URL = 'https://nxlyzlfjvnoyvjysamkx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_xaJYz0J2ofBLZGIJM4W5ww_wCiff...'; // Replace with your actual publishable key copied earlier
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let masterCards = [];
    let userInventory = {};
    let currentUser = null;
    let isFlipped = false;

    // --- Authentication Flow ---
    async function initAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      updateAuthUI(session?.user || null);

      supabase.auth.onAuthStateChange((event, session) => {
        updateAuthUI(session?.user || null);
      });

      document.getElementById('loginBtn').addEventListener('click', async () => {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'twitch',
          options: { redirectTo: window.location.origin }
        });
        if (error) console.error('Twitch Login Error:', error.message);
      });
    }

    function updateAuthUI(user) {
      currentUser = user;
      const authSection = document.getElementById('authSection');
      if (user) {
        const username = user.user_metadata?.preferred_username || user.user_metadata?.full_name || 'Streamer';
        const avatar = user.user_metadata?.avatar_url;
        authSection.innerHTML = `
          <div class="user-pill">
            ${avatar ? `<img src="${avatar}" style="width:22px; height:22px; border-radius:50%; object-fit:cover;" />` : ''}
            <span>${username}</span>
          </div>
          <button class="btn" id="logoutBtn" style="padding: 6px 12px; font-size: 0.8rem;">Log Out</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', async () => {
          await supabase.auth.signOut();
          window.location.reload();
        });
        fetchUserInventory(user.id);
      } else {
        authSection.innerHTML = `<button class="btn-twitch" id="loginBtn">Log in with Twitch</button>`;
        document.getElementById('loginBtn').addEventListener('click', async () => {
          await supabase.auth.signInWithOAuth({
            provider: 'twitch',
            options: { redirectTo: window.location.origin }
          });
        });
      }
    }

    // --- Data Fetching from Supabase ---
    async function initBinder() {
      await initAuth();
      await fetchMasterCards();
    }

    async function fetchMasterCards() {
      const { data, error } = await supabase.from('cards').select('*');
      if (error) {
        console.error('Error fetching cards:', error.message);
        document.getElementById('cardGrid').innerHTML = `<div class="loading-state">Error loading binder catalog.</div>`;
        return;
      }
      masterCards = (data || []).map(c => ({
        Card_ID: c.card_id,
        Card_Name: c.card_name,
        ArtworkURL: c.artwork_url,
        CardBackURL: c.card_back_url,
        Foil_Matte: c.foil_matte_url,
        Prismatic_Texture: c.prismatic_texture_url
      }));
      render();
    }

    async function fetchUserInventory(userId) {
      const { data, error } = await supabase
        .from('user_inventory')
        .select('*')
        .eq('user_id', userId);
      
      if (!error && data) {
        userInventory = {};
        data.forEach(item => {
          userInventory[item.card_id] = item.quantity || 1;
        });
        render();
      }
    }

    // --- Render Logic ---
    function render() {
      const grid = document.getElementById('cardGrid');
      const variant = document.getElementById('variantSelect').value;
      grid.innerHTML = '';

      if (masterCards.length === 0) {
        grid.innerHTML = `<div class="loading-state">No cards found in catalog.</div>`;
        return;
      }

      masterCards.forEach((card) => {
        const quantity = currentUser ? (userInventory[card.Card_ID] || 0) : 1; // Default to owned if unauthenticated for testing
        const isOwned = quantity > 0;
        
        const cardEl = document.createElement('div');
        cardEl.className = `card-container ${isOwned ? '' : 'unowned'}`;

        cardEl.innerHTML = `
          <div class="card-3d-wrapper">
            <div class="face face-front">
              <img class="card-img" src="${card.ArtworkURL}" alt="${card.Card_Name}">
              <div class="finish-layer" style="${getFinishConfig(variant, card, 50, 50)}"></div>
            </div>
            <div class="face face-back">
              <img class="card-img" src="${card.CardBackURL}" alt="Back">
            </div>
          </div>
        `;

        const wrapper = cardEl.querySelector('.card-3d-wrapper');
        const finishLayer = cardEl.querySelector('.finish-layer');

        cardEl.addEventListener('mousemove', (e) => {
          const rect = cardEl.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const xc = x - rect.width / 2;
          const yc = y - rect.height / 2;

          wrapper.style.transform = `rotateX(${(-yc / rect.height) * 14}deg) rotateY(${(xc / rect.width) * 14}deg)`;

          if ((variant === 'Foil' && card.Foil_Matte) || (variant === 'Prismatic' && card.Prismatic_Texture)) {
            const posX = (x / rect.width) * 100;
            const posY = (y / rect.height) * 100;
            if (variant === 'Foil') {
              finishLayer.style.backgroundPosition = `${posX}% ${posY}%`;
            } else if (variant === 'Prismatic') {
              finishLayer.style.cssText = getFinishConfig(variant, card, posX, posY);
            }
          }
        });

        cardEl.addEventListener('mouseleave', () => {
          wrapper.style.transform = `rotateX(0deg) rotateY(0deg)`;
          if (variant === 'Foil' && card.Foil_Matte) {
            finishLayer.style.backgroundPosition = `50% 50%`;
          } else if (variant === 'Prismatic' && card.Prismatic_Texture) {
            finishLayer.style.cssText = getFinishConfig(variant, card, 50, 50);
          }
        });

        cardEl.addEventListener('click', () => openModal(card, quantity, variant));
        grid.appendChild(cardEl);
      });
    }

    function getFinishConfig(variant, card, posX = 50, posY = 50) {
      if (variant === 'Foil') {
        if (!card.Foil_Matte) return 'display: none;';
        return `
          background: radial-gradient(circle at ${posX}% ${posY}%, 
            rgba(255, 255, 255, 0.95) 0%, 
            rgba(210, 210, 210, 0.7) 25%, 
            rgba(60, 60, 60, 0.85) 55%, 
            rgba(5, 5, 5, 0.98) 85%
          );
          background-size: 200% 200%;
          background-position: ${posX}% ${posY}%;
          -webkit-mask-image: url('${card.Foil_Matte}');
          mask-image: url('${card.Foil_Matte}');
          -webkit-mask-mode: luminance;
          mask-mode: luminance;
          -webkit-mask-size: cover;
          mask-size: cover;
          -webkit-mask-position: center;
          mask-position: center;
          mix-blend-mode: overlay;
        `;
      } else if (variant === 'Prismatic') {
        if (!card.Prismatic_Texture) return 'display: none;';
        return `
          background: 
            radial-gradient(circle at ${posX}% ${posY}%, 
              rgba(255, 120, 220, 0.22) 0%, 
              rgba(120, 220, 255, 0.18) 30%, 
              transparent 60%
            ),
            linear-gradient(115deg, 
              rgba(255, 40, 140, 0.25), 
              rgba(40, 210, 255, 0.25), 
              rgba(255, 220, 40, 0.25), 
              rgba(40, 255, 140, 0.25), 
              rgba(255, 40, 140, 0.25)
            );
          background-size: 100% 100%, 250% 100%;
          background-position: center, 0% 50%;
          animation: oscillateSheen 7s ease-in-out infinite alternate;
          -webkit-mask-image: url('${card.Prismatic_Texture}');
          mask-image: url('${card.Prismatic_Texture}');
          -webkit-mask-mode: luminance;
          mask-mode: luminance;
          -webkit-mask-size: cover;
          mask-size: cover;
          -webkit-mask-position: center;
          mask-position: center;
          mix-blend-mode: color-dodge;
        `;
      }
      return 'display: none;';
    }

    const modalOverlay = document.getElementById('modalOverlay');
    const modalCard = document.getElementById('modalCard');
    const modalStage = document.getElementById('modalStage');

    function openModal(card, quantity, variant) {
      isFlipped = false;
      document.getElementById('modalTitle').innerText = card.Card_Name;
      document.getElementById('modalVariant').innerText = variant;
      document.getElementById('modalQuantity').innerText = `${quantity}x owned`;
      document.getElementById('modalFrontImg').src = card.ArtworkURL;
      document.getElementById('modalBackImg').src = card.CardBackURL;
      document.getElementById('modalFinishLayer').style.cssText = getFinishConfig(variant, card, 50, 50);
      modalCard.style.transform = 'rotateX(0deg) rotateY(0deg)';
      modalOverlay.classList.add('active');
    }

    document.getElementById('modalClose').addEventListener('click', () => modalOverlay.classList.remove('active'));
    document.getElementById('modalFlipBtn').addEventListener('click', () => {
      isFlipped = !isFlipped;
      modalCard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
    });

    modalStage.addEventListener('mousemove', (e) => {
      const rect = modalStage.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const xc = x - rect.width / 2;
      const yc = y - rect.height / 2;

      modalCard.style.transform = `rotateX(${(-yc / rect.height) * 14}deg) rotateY(${(isFlipped ? 180 : 0) + (xc / rect.width) * 14}deg)`;
      
      const finishLayer = document.getElementById('modalFinishLayer');
      const currentVariant = document.getElementById('variantSelect').value;
      if (finishLayer && masterCards.length > 0) {
        if (currentVariant === 'Foil') {
          const posX = (x / rect.width) * 100;
          const posY = (y / rect.height) * 100;
          finishLayer.style.backgroundPosition = `${posX}% ${posY}%`;
        } else if (currentVariant === 'Prismatic') {
          const posX = (x / rect.width) * 100;
          const posY = (y / rect.height) * 100;
          finishLayer.style.cssText = getFinishConfig('Prismatic', masterCards[0], posX, posY);
        }
      }
    });

    modalStage.addEventListener('mouseleave', () => {
      modalCard.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
      const finishLayer = document.getElementById('modalFinishLayer');
      if (finishLayer && masterCards.length > 0) {
        const currentVariant = document.getElementById('variantSelect').value;
        if (currentVariant === 'Foil') finishLayer.style.backgroundPosition = `50% 50%`;
        if (currentVariant === 'Prismatic') finishLayer.style.cssText = getFinishConfig('Prismatic', masterCards[0], 50, 50);
      }
    });

    // --- Admin Editor Code ---
    let typedBuffer = "";
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
      typedBuffer = (typedBuffer + e.key.toLowerCase()).slice(-6);
      if (typedBuffer === "matrix" && prompt("🔒 Password:") === "secret123") {
        const tbody = document.getElementById('sheetTableBody');
        tbody.innerHTML = '';
        masterCards.forEach(c => addRow(c));
        document.getElementById('adminModal').classList.add('active');
      }
    });

    function addRow(c = {}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="e-id" value="${c.Card_ID || ''}"></td>
        <td><input class="e-name" value="${c.Card_Name || ''}"></td>
        <td><input class="e-art" value="${c.ArtworkURL || ''}"></td>
        <td><input class="e-back" value="${c.CardBackURL || ''}"></td>
        <td><input class="e-foil" value="${c.Foil_Matte || ''}"></td>
        <td><input class="e-prism" value="${c.Prismatic_Texture || ''}"></td>
        <td><button class="btn btn-danger" style="padding: 2px 6px;" onclick="this.closest('tr').remove()">X</button></td>
      `;
      document.getElementById('sheetTableBody').appendChild(tr);
    }

    document.getElementById('addRowBtn').addEventListener('click', () => addRow());
    document.getElementById('closeAdminBtn').addEventListener('click', () => document.getElementById('adminModal').classList.remove('active'));
    document.getElementById('cancelAdminBtn').addEventListener('click', () => document.getElementById('adminModal').classList.remove('active'));
    
    document.getElementById('saveAdminBtn').addEventListener('click', async () => {
      const updatedCards = Array.from(document.querySelectorAll('#sheetTableBody tr')).map(row => ({
        card_id: row.querySelector('.e-id').value.trim(),
        card_name: row.querySelector('.e-name').value.trim(),
        artwork_url: row.querySelector('.e-art').value.trim(),
        card_back_url: row.querySelector('.e-back').value.trim(),
        foil_matte_url: row.querySelector('.e-foil').value.trim(),
        prismatic_texture_url: row.querySelector('.e-prism').value.trim()
      }));

      // Upsert rows back into Supabase cards table
      const { error } = await supabase.from('cards').upsert(updatedCards);
      if (error) {
        alert('Error saving to Supabase: ' + error.message);
      } else {
        alert('Successfully updated master catalog in Supabase!');
        document.getElementById('adminModal').classList.remove('active');
        fetchMasterCards();
      }
    });

    document.getElementById('resetDefaultBtn').addEventListener('click', () => {
      fetchMasterCards();
      document.getElementById('adminModal').classList.remove('active');
    });

    document.getElementById('variantSelect').addEventListener('change', render);
    initBinder();
  </script>
</body>
</html>
